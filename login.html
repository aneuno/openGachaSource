<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="login">

        <h1>Connexion</h1>

        <input
            type="text"
            id="username"
            placeholder="Pseudo"
            autocomplete="username"
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Mot de passe"
            autocomplete="new-password"
        >

        <button id="loginButton">
            Se connecter
        </button>

        <button id="registerButton">
            Créer un compte
        </button>

        <p id="message"></p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>

</body>

</html>
