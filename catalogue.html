<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Catalogue</title>

    <link
        rel="stylesheet"
        href="catalogue.css"
    >

</head>


<body>


    <!-- ============================== -->
    <!-- HEADER                         -->
    <!-- ============================== -->

    <header>

        <h1>
            Catalogue
        </h1>

        <button id="backButton">
            Retour
        </button>

    </header>


    <!-- ============================== -->
    <!-- RECHERCHE                      -->
    <!-- ============================== -->

    <section id="catalogueControls">

        <input
            type="text"
            id="searchInput"
            placeholder="Rechercher un personnage..."
            autocomplete="off"
        >

        <span id="catalogueCount">
            Chargement...
        </span>

    </section>


    <!-- ============================== -->
    <!-- CATALOGUE                      -->
    <!-- ============================== -->

    <main>

        <div id="catalogue">

            <p id="message">
                Chargement du catalogue...
            </p>

        </div>

    </main>


    <!-- ============================== -->
    <!-- MODALE DETAIL PERSONNAGE       -->
    <!-- ============================== -->

    <div
        class="modalOverlay"
        id="modalOverlay"
    >

        <div class="modalCard">

            <button
                class="modalClose"
                id="modalClose"
                aria-label="Fermer"
            >
                &times;
            </button>


            <div class="modalImageWrap">

                <img
                    id="modalImage"
                    src=""
                    alt=""
                >

            </div>


            <div class="modalBody">

                <p
                    class="characterName"
                    id="modalName"
                ></p>

                <p
                    class="characterInfo"
                    id="modalRarity"
                ></p>

                <p
                    class="characterInfo"
                    id="modalId"
                ></p>

                <p
                    class="characterInfo"
                    id="modalWeight"
                ></p>

                <p
                    class="characterInfo"
                    id="modalDescription"
                ></p>

            </div>

        </div>

    </div>


    <script src="catalogue.js"></script>

</body>

</html>
