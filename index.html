<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>gachaOpenSource</title>
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>
<body>
    <!-- ============================== -->
    <!-- COMPTE                         -->
    <!-- ============================== -->
    <div id="account">
        <span id="gemsDisplay">0 gemmes</span>
        <button id="discordLinkStatus">Lier Discord</button>
        <span id="userEmail"></span>
        <button id="logoutButton">
            log out
        </button>
    </div>
    <!-- ============================== -->
    <!-- MENU PRINCIPAL                 -->
    <!-- ============================== -->
    <div id="mainMenu">
        <h1>gachaOpenSource</h1>
        <button id="bannersButton">
            Invoquer
        </button>
        <button id="inventoryButton">
            Inventaire
        </button>
    </div>
    <!-- ============================== -->
    <!-- FENETRE DE LIAISON DISCORD     -->
    <!-- ============================== -->
    <div class="modalOverlay" id="discordLinkOverlay">
        <div class="discordLinkModal">
            <button class="modalCloseButton" id="discordLinkClose">✕</button>
            <h2>Lier ton compte Discord</h2>
            <p>Tape <strong>/link</strong> sur le serveur Discord, puis entre le code reçu ci-dessous.</p>
            <input type="text" id="discordCodeInput" placeholder="Code à 6 chiffres" maxlength="6">
            <button id="discordCodeSubmit">Lier mon compte</button>
            <p id="discordLinkError" class="discordLinkError"></p>
        </div>
    </div>
    <!-- ============================== -->
    <!-- SUPABASE                       -->
    <!-- ============================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
