<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astral Rift — Invocation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="void-bg">
    <div class="rune-field"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">✦</span>
      <span class="brand-name">ASTRAL&nbsp;RIFT</span>
    </div>
    <div class="currency">
      <span class="currency-icon">◆</span>
      <span id="shardCount">100000</span>
      <span class="currency-label">éclats</span>
    </div>
  </header>

  <main class="stage">

    <section class="banner">
      <div class="banner-eyebrow">bannière limitée — porte des convoqués</div>
      <h1 class="banner-title">Le Voile s'Entrouvre</h1>
      <p class="banner-sub">Cinq âmes attendent de l'autre côté de la faille.</p>

      <div class="featured-strip" id="featuredStrip"><!-- injecté --></div>
    </section>

    <section class="gate-wrap">
      <div class="gate" id="gate">
        <div class="gate-ring ring-outer"></div>
        <div class="gate-ring ring-inner"></div>
        <div class="gate-sigil">✦</div>
        <div class="gate-particles" id="gateParticles"></div>
      </div>

      <div class="pull-controls">
        <button class="pull-btn pull-single" id="pullOne">
          <span class="pull-btn-title">Invocation</span>
          <span class="pull-btn-cost">◆ 100</span>
        </button>
        <button class="pull-btn pull-ten" id="pullTen">
          <span class="pull-badge">SR garanti</span>
          <span class="pull-btn-title">Invocation ×10</span>
          <span class="pull-btn-cost">◆ 900</span>
        </button>
      </div>
    </section>

    <section class="history-wrap">
      <h2 class="history-title">Registre des invocations</h2>
      <div class="history-list" id="historyList">
        <p class="history-empty">Aucune invocation pour l'instant. La faille attend.</p>
      </div>
    </section>

  </main>

  <div class="modal-overlay" id="resultOverlay">
    <div class="modal">
      <div class="modal-header">
        <span id="modalTitle">Résultat de l'invocation</span>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-grid" id="modalGrid"></div>
      <button class="modal-continue" id="modalContinue">Continuer</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
