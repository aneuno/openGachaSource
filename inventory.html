<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Inventaire</title>
    <link
        rel="stylesheet"
        href="inventory.css"
    >
</head>
<body>
    <!-- ============================== -->
    <!-- HEADER                         -->
    <!-- ============================== -->
    <header>
        <h1>Ma collection</h1>
        <button id="backButton">
            Retour
        </button>
    </header>
    <!-- ============================== -->
    <!-- INFORMATIONS                   -->
    <!-- ============================== -->
    <div id="collectionInfo">
        <span id="collectionCount">
            Chargement...
        </span>
    </div>
    <!-- ============================== -->
    <!-- SWITCH DE VUE                  -->
    <!-- ============================== -->
    <div id="viewSwitch">
        <button id="viewCardsButton" class="viewButton isActive">
            Cartes
        </button>
        <button id="viewBindersButton" class="viewButton">
            Classeurs
        </button>
    </div>
    <!-- ============================== -->
    <!-- CONTENU PRINCIPAL              -->
    <!-- ============================== -->
    <main>
        <!-- vue normale : toutes les cartes -->
        <div id="inventory">
            <p id="message">
                Chargement de l'inventaire...
            </p>
        </div>

        <!-- vue liste des classeurs -->
        <div id="bindersView" style="display: none;">
            <div id="bindersGrid"></div>
        </div>

        <!-- vue detail d'un classeur -->
        <div id="binderDetail" style="display: none;">
            <div id="binderDetailHeader">
                <button id="binderBackButton">
                    ← Retour aux classeurs
                </button>
                <h2 id="binderDetailTitle"></h2>
                <div id="binderDetailActions">
                    <button id="binderRenameButton">
                        Renommer
                    </button>
                    <button id="binderDeleteButton">
                        Supprimer
                    </button>
                </div>
            </div>
            <div id="binderCardsGrid"></div>
        </div>
    </main>
    <!-- ============================== -->
    <!-- FENETRE MODALE DETAIL PERSO    -->
    <!-- ============================== -->
    <div class="modalOverlay" id="modalOverlay">
        <div class="modalCard">
            <button class="modalClose" id="modalClose" aria-label="Fermer">&times;</button>
            <div class="modalImageWrap">
                <img id="modalImage" src="" alt="">
            </div>
            <div class="modalBody">
                <p class="characterName" id="modalName"></p>
                <span class="quantity" id="modalQuantity"></span>
                <p class="characterInfo" id="modalRarity"></p>
                <p class="characterInfo" id="modalId"></p>
                <p class="characterInfo" id="modalWeight"></p>
            </div>
        </div>
    </div>
    <!-- ============================== -->
    <!-- FENETRE AJOUT CARTE AU CLASSEUR -->
    <!-- ============================== -->
    <div class="modalOverlay" id="addCardOverlay">
        <div class="modalCard addCardModal">
            <button class="modalClose" id="addCardClose" aria-label="Fermer">&times;</button>
            <div class="addCardModalBody">
                <h2>Ajouter une carte</h2>
                <div id="addCardGrid"></div>
            </div>
        </div>
    </div>
    <!-- ============================== -->
    <!-- SUPABASE                       -->
    <!-- ============================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="inventory.js"></script>
</body>
</html>
